<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le jeu</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f5f0e7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .game-container {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 34px;
        color: #151515;
    }

    .subtitle {
        margin-bottom: 16px;
        font-size: 18px;
        color: #666;
        font-weight: bold;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        border: 3px solid #222;
        border-radius: 10px;
        touch-action: manipulation;
    }

    .info {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    #score {
        font-size: 20px;
        font-weight: bold;
        color: #222;
    }

    button {
        border: none;
        background: #222;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .hint {
        margin-top: 12px;
        font-size: 14px;
        color: #666;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1> Ostie de français !</h1>

    <div class="subtitle">
        Saute les obstacles et cours à travers Montréal !
    </div>

    <!-- Le canvas est maintenant beaucoup plus haut -->
    <canvas id="game" width="800" height="500"></canvas>

    <div class="info">
        <span id="score">Score : 0</span>
        <button id="start">Commencer</button>
    </div>

    <div class="hint">
        Espace / ↑ / clic / toucher l'écran pour sauter
    </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

/*
=========================================================
SOL

Cette valeur détermine exactement où les pieds
du personnage et les obstacles touchent le décor.
=========================================================
*/

const GROUND = 440;


/*
=========================================================
IMAGES
=========================================================
*/

const playerImage = new Image();
playerImage.src = "player.png";

const backgroundImage = new Image();
backgroundImage.src = "background.jpg";


/*
=========================================================
HTML
=========================================================
*/

const scoreDisplay = document.getElementById("score");
const startButton = document.getElementById("start");


/*
=========================================================
VARIABLES
=========================================================
*/

let player;
let obstacles = [];

let running = false;
let gameOver = false;

let score = 0;
let speed = 5;
let obstacleTimer = 0;

let lastTime = 0;

let won = false;

const WIN_SCORE = 1997;


/*
=========================================================
JOUEUR
=========================================================
*/

function resetPlayer() {

    player = {
        x: 85,

        /*
        Le personnage est maintenant plus grand.
        Ses pieds sont exactement sur GROUND.
        */

        y: GROUND - 105,

        width: 65,
        height: 125,

        velocityY: 0,
        jumping: false
    };
}


/*
=========================================================
RESET
=========================================================
*/

function resetGame() {

    resetPlayer();

    obstacles = [];

    score = 0;
    speed = 5;
    obstacleTimer = 0;

    gameOver = false;
    running = false;
    won = false;

    scoreDisplay.textContent = "Score : 0";
    startButton.textContent = "Commencer";

    draw();
}


/*
=========================================================
DEMARRER
=========================================================
*/

function startGame() {

    resetPlayer();

    obstacles = [];

    score = 0;
    speed = 5;
    obstacleTimer = 0;

    gameOver = false;
    running = true;
    won = false;

    lastTime = performance.now();

    startButton.textContent = "Recommencer";

    requestAnimationFrame(gameLoop);
}


/*
=========================================================
SAUT
=========================================================
*/

function jump() {

    if (!running) {
        startGame();
        return;
    }

    if (!player.jumping) {

        /*
        Saut un peu plus haut pour tenir compte
        du nouveau format du jeu.
        */

        player.velocityY = -15;

        player.jumping = true;
    }
}


/*
=========================================================
OBSTACLES
=========================================================
*/

function createObstacle() {

    const width = 28 + Math.random() * 22;
    const height = 45 + Math.random() * 35;

    obstacles.push({
        x: WIDTH + 10,
        y: GROUND - height,
        width: width,
        height: height
    });
}


/*
=========================================================
COLLISIONS
=========================================================
*/

function checkCollision(a, b) {

    const paddingX = 8;
    const paddingY = 5;

    return (
        a.x + paddingX < b.x + b.width &&
        a.x + a.width - paddingX > b.x &&
        a.y + paddingY < b.y + b.height &&
        a.y + a.height - paddingY > b.y
    );
}


/*
=========================================================
UPDATE
=========================================================
*/

function update(delta) {

    if (!running) {
        return;
    }


    /* Gravité */

    player.velocityY += 0.75;
    player.y += player.velocityY;


    /* Retour au trottoir */

    if (player.y >= GROUND - player.height) {

        player.y = GROUND - player.height;

        player.velocityY = 0;
        player.jumping = false;
    }


    /* Accélération progressive */

    speed += 0.000025 * delta;


    /* Apparition des obstacles */

    obstacleTimer -= delta;

if (obstacleTimer <= 0) {

    createObstacle();

    /*
    progress va de 0 au début à 1 à 1997 points.
    */

    const progress =
        Math.min(score / WIN_SCORE, 1);

    /*
    Au début :
    environ 1300 à 1900 ms entre les obstacles.

    À la fin :
    environ 850 à 1250 ms.

    La difficulté augmente donc progressivement
    sans changement brutal.
    */

    const minimumDelay =
        1300 - (450 * progress);

    const randomDelay =
        600 - (200 * progress);

    obstacleTimer =
        minimumDelay +
        Math.random() * randomDelay;
}


    /* Déplacement */

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        obstacle.x -=
            speed * (delta / 16.67);


        if (checkCollision(player, obstacle)) {

            endGame();
            return;
        }


        if (obstacle.x + obstacle.width < 0) {

            obstacles.splice(i, 1);
        }
    }


    /* Score */

   /*
Environ 12 points par seconde.

1997 points correspondent donc à environ
2 minutes 45 secondes de survie.
*/

score += delta * 0.012;


/*
VICTOIRE
*/

if (score >= WIN_SCORE) {

    score = WIN_SCORE;

    scoreDisplay.textContent =
        "Score : " + WIN_SCORE;

    winGame();

    return;
}


scoreDisplay.textContent =
    "Score : " + Math.floor(score);


/*
=========================================================
GAME OVER
=========================================================
*/

function endGame() {

    running = false;
    gameOver = true;

    startButton.textContent = "Recommencer";

    draw();
}
   
/*
=========================================================
VICTOIRE
=========================================================
*/

function winGame() {

    running = false;
    gameOver = false;
    won = true;

    startButton.textContent = "Rejouer";

    draw();
}

/*
=========================================================
VICTOIRE
=========================================================
*/

if (won) {

    /*
    Assombrit légèrement le décor
    pour faire ressortir le message.
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.88)";

    ctx.fillRect(
        55,
        115,
        WIDTH - 110,
        245
    );


    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;

    ctx.strokeRect(
        55,
        115,
        WIDTH - 110,
        245
    );


    ctx.fillStyle = "#222";

    ctx.textAlign = "center";


    /*
    Titre
    */

    ctx.font =
        "bold 34px Arial";

    ctx.fillText(
        "BRAVO !",
        WIDTH / 2,
        165
    );


    /*
    Message sur plusieurs lignes
    */

    ctx.font =
        "bold 20px Arial";

    ctx.fillText(
        "T'as bien gagné un indice,",
        WIDTH / 2,
        215
    );

    ctx.fillText(
        "ostie de française...",
        WIDTH / 2,
        248
    );


    ctx.font =
        "bold 23px Arial";

    ctx.fillText(
        "Le mot indice est :",
        WIDTH / 2,
        295
    );


    /*
    Mot secret plus gros
    */

    ctx.font =
        "bold 36px Arial";

    ctx.fillText(
        "SERPENT",
        WIDTH / 2,
        335
    );


    ctx.font =
        "18px Arial";

    ctx.fillText(
        "Bonne chance pour la suite !",
        WIDTH / 2,
        375
    );


    ctx.textAlign = "left";
}
   
/*
=========================================================
DECOR

Cette version montre quasiment toute l'image,
sans la recadrer agressivement.
=========================================================
*/

function drawBackground() {

    if (
        backgroundImage.complete &&
        backgroundImage.naturalWidth > 0
    ) {

        /*
        On affiche toute l'image dans le canvas.

        Ton image est proche du ratio du nouveau canvas,
        donc on perd très peu de décor.
        */

        ctx.drawImage(
            backgroundImage,
            0,
            0,
            WIDTH,
            HEIGHT
        );

    } else {

        ctx.fillStyle = "#eee7dc";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }


    /*
    Voile très léger.

    Je l'ai réduit par rapport à la version précédente
    pour conserver davantage les couleurs du décor.
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.20)";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/*
=========================================================
PERSONNAGE
=========================================================
*/

function drawPlayer() {

    if (
        playerImage.complete &&
        playerImage.naturalWidth > 0
    ) {

        ctx.save();

        /*
        Halo blanc discret pour détacher
        la photo du décor.
        */

        ctx.shadowColor =
            "rgba(255,255,255,1)";

        ctx.shadowBlur = 6;

        ctx.drawImage(
            playerImage,
            player.x,
            player.y,
            player.width,
            player.height
        );

        ctx.restore();

    } else {

        ctx.fillStyle = "#222";

        ctx.fillRect(
            player.x,
            player.y,
            player.width,
            player.height
        );
    }
}


/*
=========================================================
OBSTACLES
=========================================================
*/

function drawObstacles() {

    for (const obstacle of obstacles) {

        /*
        Contour clair
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.95)";

        ctx.fillRect(
            obstacle.x - 3,
            obstacle.y - 3,
            obstacle.width + 6,
            obstacle.height + 3
        );


        /*
        Obstacle
        */

        ctx.fillStyle = "#181818";

        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }
}


/*
=========================================================
DESSIN GENERAL
=========================================================
*/

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* Montréal */

    drawBackground();


    /*
    Ligne très discrète au niveau du sol.

    Contrairement à la version précédente,
    je SUPPRIME la grosse bande noire du bas :
    elle cachait une partie du décor et empêchait
    le personnage de sembler réellement marcher dedans.
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.45)";

    ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        2
    );


    /* Personnage */

    drawPlayer();


    /* Obstacles */

    drawObstacles();


    /*
    =====================================================
    DEPART
    =====================================================
    */

    if (!running && !gameOver) {

        /*
        Petit cartouche plutôt qu'un voile
        sur toute l'image.
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.fillRect(
            WIDTH / 2 - 165,
            22,
            330,
            48
        );

        ctx.fillStyle = "#111";

        ctx.font = "bold 23px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "Clique sur « Commencer »",
            WIDTH / 2,
            54
        );

        ctx.textAlign = "left";
    }


    /*
    =====================================================
    GAME OVER
    =====================================================
    */

    if (gameOver) {

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.fillRect(
            WIDTH / 2 - 150,
            HEIGHT / 2 - 70,
            300,
            120
        );

        ctx.fillStyle = "#222";

        ctx.textAlign = "center";

        ctx.font = "bold 32px Arial";

        ctx.fillText(
            "GAME OVER",
            WIDTH / 2,
            HEIGHT / 2 - 15
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            "Score : " + Math.floor(score),
            WIDTH / 2,
            HEIGHT / 2 + 20
        );

        ctx.textAlign = "left";
    }
}


/*
=========================================================
BOUCLE
=========================================================
*/

function gameLoop(timestamp) {

    if (!running) {

        draw();
        return;
    }

    let delta =
        timestamp - lastTime;

    lastTime = timestamp;

    if (delta > 50) {
        delta = 50;
    }

    update(delta);

    draw();

    if (running) {

        requestAnimationFrame(gameLoop);
    }
}


/*
=========================================================
CONTROLES
=========================================================
*/

startButton.addEventListener(
    "click",
    function() {
        startGame();
    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        jump();
    }
);


/*
=========================================================
CHARGEMENT
=========================================================
*/

playerImage.onload = function() {
    draw();
};

backgroundImage.onload = function() {
    draw();
};

playerImage.onerror = function() {

    console.log(
        "Impossible de charger player.png"
    );

    draw();
};

backgroundImage.onerror = function() {

    console.log(
        "Impossible de charger background.jpg"
    );

    draw();
};


/*
=========================================================
INITIALISATION
=========================================================
*/

resetGame();

</script>

</body>
</html>
