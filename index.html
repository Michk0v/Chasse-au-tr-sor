<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le jeu</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .game-container {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        margin: 0 0 15px 0;
        font-size: 28px;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        border: 2px solid #222;
        border-radius: 8px;
        touch-action: manipulation;
    }

    .info {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    #score {
        font-size: 18px;
        font-weight: bold;
    }

    button {
        border: none;
        background: #222;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .hint {
        margin-top: 10px;
        font-size: 14px;
        color: #666;
    }

</style>
</head>

<body>

<div class="game-container">

    <h1>🏃 Le jeu</h1>

    <canvas
        id="game"
        width="800"
        height="260">
    </canvas>

    <div class="info">

        <span id="score">
            Score : 0
        </span>

        <button id="start">
            Commencer
        </button>

    </div>

    <div class="hint">
        Espace / ↑ / clic / toucher l'écran pour sauter
    </div>

</div>


<script>

    /* =========================================================
       CANVAS
    ========================================================= */

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const GROUND = 218;


    /* =========================================================
       IMAGE DU PERSONNAGE
    ========================================================= */

    const playerImage = new Image();

    playerImage.src = "player.png";


    /* =========================================================
       ELEMENTS HTML
    ========================================================= */

    const scoreDisplay = document.getElementById("score");
    const startButton = document.getElementById("start");


    /* =========================================================
       VARIABLES DU JEU
    ========================================================= */

    let player;

    let obstacles = [];

    let running = false;

    let gameOver = false;

    let score = 0;

    let speed = 5;

    let obstacleTimer = 0;

    let lastTime = 0;


    /* =========================================================
       INITIALISATION DU JOUEUR
    ========================================================= */

    function resetPlayer() {

        player = {

            x: 80,

            y: GROUND - 64,

            width: 22,

            height: 64,

            velocityY: 0,

            jumping: false

        };

    }


    /* =========================================================
       RESET DU JEU
    ========================================================= */

    function resetGame() {

        resetPlayer();

        obstacles = [];

        score = 0;

        speed = 5;

        obstacleTimer = 0;

        gameOver = false;

        running = false;

        scoreDisplay.textContent = "Score : 0";

        startButton.textContent = "Commencer";

        draw();

    }


    /* =========================================================
       DEMARRER LE JEU
    ========================================================= */

    function startGame() {

        resetPlayer();

        obstacles = [];

        score = 0;

        speed = 5;

        obstacleTimer = 0;

        gameOver = false;

        running = true;

        lastTime = performance.now();

        startButton.textContent = "Recommencer";

        requestAnimationFrame(gameLoop);

    }


    /* =========================================================
       SAUT
    ========================================================= */

    function jump() {

        if (!running) {

            startGame();

            return;

        }

        if (!player.jumping) {

            player.velocityY = -11.5;

            player.jumping = true;

        }

    }


    /* =========================================================
       CREATION DES OBSTACLES
    ========================================================= */

    function createObstacle() {

        const width = 18 + Math.random() * 20;

        const height = 28 + Math.random() * 28;

        obstacles.push({

            x: WIDTH + 10,

            y: GROUND - height,

            width: width,

            height: height

        });

    }


    /* =========================================================
       COLLISION
    ========================================================= */

    function checkCollision(a, b) {

        const padding = 5;

        return (

            a.x + padding < b.x + b.width &&

            a.x + a.width - padding > b.x &&

            a.y + padding < b.y + b.height &&

            a.y + a.height - padding > b.y

        );

    }


    /* =========================================================
       MISE A JOUR DU JEU
    ========================================================= */

    function update(delta) {

        if (!running) {
            return;
        }


        /* Gravité */

        player.velocityY += 0.62;

        player.y += player.velocityY;


        /* Sol */

        if (player.y >= GROUND - player.height) {

            player.y = GROUND - player.height;

            player.velocityY = 0;

            player.jumping = false;

        }


        /* Vitesse progressive */

        speed += 0.0007 * delta;


        /* Gestion des obstacles */

        obstacleTimer -= delta;

        if (obstacleTimer <= 0) {

            createObstacle();

            const minimumDelay = 900;

            const randomDelay = Math.random() * 600;

            obstacleTimer = minimumDelay + randomDelay;

        }


        /* Déplacement des obstacles */

        for (let i = obstacles.length - 1; i >= 0; i--) {

            const obstacle = obstacles[i];

            obstacle.x -= speed * (delta / 16.67);


            /* Collision */

            if (checkCollision(player, obstacle)) {

                endGame();

                return;

            }


            /* Suppression des obstacles sortis */

            if (obstacle.x + obstacle.width < 0) {

                obstacles.splice(i, 1);

            }

        }


        /* Score */

        score += delta * 0.01;

        scoreDisplay.textContent =
            "Score : " + Math.floor(score);

    }


    /* =========================================================
       FIN DU JEU
    ========================================================= */

    function endGame() {

        running = false;

        gameOver = true;

        startButton.textContent = "Recommencer";

        draw();

    }


    /* =========================================================
       DESSIN
    ========================================================= */

    function draw() {

        /* Fond */

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* Petits éléments décoratifs */

        ctx.fillStyle = "#eeeeee";

        ctx.fillRect(
            120,
            40,
            3,
            3
        );

        ctx.fillRect(
            300,
            70,
            3,
            3
        );

        ctx.fillRect(
            520,
            35,
            3,
            3
        );

        ctx.fillRect(
            700,
            80,
            3,
            3
        );


        /* Sol */

        ctx.fillStyle = "#222222";

        ctx.fillRect(
            0,
            GROUND,
            WIDTH,
            2
        );


        /* =====================================================
           PERSONNAGE
        ===================================================== */

        if (
            playerImage.complete &&
            playerImage.naturalWidth > 0
        ) {

            ctx.drawImage(

                playerImage,

                player.x,
                player.y,

                player.width,
                player.height

            );

        }
        else {

            /* Rectangle de secours si l'image ne charge pas */

            ctx.fillStyle = "#444444";

            ctx.fillRect(

                player.x,
                player.y,

                player.width,
                player.height

            );

        }


        /* =====================================================
           OBSTACLES
        ===================================================== */

        ctx.fillStyle = "#222222";

        for (const obstacle of obstacles) {

            ctx.fillRect(

                obstacle.x,
                obstacle.y,

                obstacle.width,
                obstacle.height

            );

        }


        /* =====================================================
           ECRAN DE DEPART
        ===================================================== */

        if (!running && !gameOver) {

            ctx.fillStyle = "rgba(255,255,255,0.75)";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            ctx.fillStyle = "#222222";

            ctx.font = "bold 24px Arial";

            ctx.textAlign = "center";

            ctx.fillText(
                "Clique sur « Commencer »",
                WIDTH / 2,
                HEIGHT / 2
            );

            ctx.textAlign = "left";

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        if (gameOver) {

            ctx.fillStyle = "rgba(255,255,255,0.78)";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            ctx.fillStyle = "#222222";

            ctx.textAlign = "center";

            ctx.font = "bold 32px Arial";

            ctx.fillText(
                "GAME OVER",
                WIDTH / 2,
                HEIGHT / 2 - 10
            );

            ctx.font = "18px Arial";

            ctx.fillText(
                "Score : " + Math.floor(score),
                WIDTH / 2,
                HEIGHT / 2 + 25
            );

            ctx.textAlign = "left";

        }

    }


    /* =========================================================
       BOUCLE PRINCIPALE
    ========================================================= */

    function gameLoop(timestamp) {

        if (!running) {

            draw();

            return;

        }


        let delta = timestamp - lastTime;

        lastTime = timestamp;


        /* Evite les gros sauts si la page a été inactive */

        if (delta > 50) {
            delta = 50;
        }


        update(delta);

        draw();


        if (running) {

            requestAnimationFrame(gameLoop);

        }

    }


    /* =========================================================
       BOUTON
    ========================================================= */

    startButton.addEventListener(
        "click",
        function() {

            startGame();

        }
    );


    /* =========================================================
       CLAVIER
    ========================================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.code === "Space" ||
                event.code === "ArrowUp"
            ) {

                event.preventDefault();

                jump();

            }

        }
    );


    /* =========================================================
       SOURIS / TELEPHONE
    ========================================================= */

    canvas.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            jump();

        }
    );


    /* =========================================================
       CHARGEMENT DE L'IMAGE
    ========================================================= */

    playerImage.onload = function() {

        draw();

    };


    playerImage.onerror = function() {

        console.log(
            "Erreur : impossible de charger player.png"
        );

        draw();

    };


    /* =========================================================
       INITIALISATION
    ========================================================= */

    resetGame();

</script>

</body>
</html>
