<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le jeu</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f5f0e7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .game-container {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 34px;
        color: #151515;
    }

    .subtitle {
        margin-bottom: 16px;
        font-size: 18px;
        color: #666;
        font-weight: bold;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        border: 3px solid #222;
        border-radius: 10px;
        touch-action: manipulation;
    }

    .info {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    #score {
        font-size: 20px;
        font-weight: bold;
        color: #222;
    }

    button {
        border: none;
        background: #222;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .hint {
        margin-top: 12px;
        font-size: 14px;
        color: #666;
    }

</style>
</head>

<body>

<div class="game-container">

    <h1>🏃 LE JEU</h1>

    <div class="subtitle">
        Saute les obstacles et cours à travers Montréal !
    </div>

    <canvas
        id="game"
        width="800"
        height="260">
    </canvas>

    <div class="info">

        <span id="score">
            Score : 0
        </span>

        <button id="start">
            Commencer
        </button>

    </div>

    <div class="hint">
        Espace / ↑ / clic / toucher l'écran pour sauter
    </div>

</div>


<script>

    /* =========================================================
       CANVAS
    ========================================================= */

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const GROUND = 222;


    /* =========================================================
       IMAGES
    ========================================================= */

    const playerImage = new Image();
    playerImage.src = "player.png";

    const backgroundImage = new Image();
    backgroundImage.src = "background.jpg";


    /* =========================================================
       ELEMENTS HTML
    ========================================================= */

    const scoreDisplay = document.getElementById("score");
    const startButton = document.getElementById("start");


    /* =========================================================
       VARIABLES DU JEU
    ========================================================= */

    let player;
    let obstacles = [];

    let running = false;
    let gameOver = false;

    let score = 0;
    let speed = 5;
    let obstacleTimer = 0;

    let lastTime = 0;


    /* =========================================================
       JOUEUR
    ========================================================= */

    function resetPlayer() {

        player = {
            x: 80,
            y: GROUND - 68,
            width: 23,
            height: 68,
            velocityY: 0,
            jumping: false
        };

    }


    /* =========================================================
       RESET
    ========================================================= */

    function resetGame() {

        resetPlayer();

        obstacles = [];

        score = 0;
        speed = 5;
        obstacleTimer = 0;

        gameOver = false;
        running = false;

        scoreDisplay.textContent = "Score : 0";
        startButton.textContent = "Commencer";

        draw();

    }


    /* =========================================================
       DEMARRER
    ========================================================= */

    function startGame() {

        resetPlayer();

        obstacles = [];

        score = 0;
        speed = 5;
        obstacleTimer = 0;

        gameOver = false;
        running = true;

        lastTime = performance.now();

        startButton.textContent = "Recommencer";

        requestAnimationFrame(gameLoop);

    }


    /* =========================================================
       SAUT
    ========================================================= */

    function jump() {

        if (!running) {

            startGame();
            return;

        }

        if (!player.jumping) {

            player.velocityY = -11.5;
            player.jumping = true;

        }

    }


    /* =========================================================
       OBSTACLES
    ========================================================= */

    function createObstacle() {

        const width = 20 + Math.random() * 18;
        const height = 30 + Math.random() * 28;

        obstacles.push({
            x: WIDTH + 10,
            y: GROUND - height,
            width: width,
            height: height
        });

    }


    /* =========================================================
       COLLISION
    ========================================================= */

    function checkCollision(a, b) {

        const paddingX = 5;
        const paddingY = 3;

        return (

            a.x + paddingX < b.x + b.width &&

            a.x + a.width - paddingX > b.x &&

            a.y + paddingY < b.y + b.height &&

            a.y + a.height - paddingY > b.y

        );

    }


    /* =========================================================
       MISE A JOUR
    ========================================================= */

    function update(delta) {

        if (!running) {
            return;
        }


        /* Gravité */

        player.velocityY += 0.62;
        player.y += player.velocityY;


        /* Retour au sol */

        if (player.y >= GROUND - player.height) {

            player.y = GROUND - player.height;

            player.velocityY = 0;
            player.jumping = false;

        }


        /* Accélération */

        speed += 0.0007 * delta;


        /* Apparition des obstacles */

        obstacleTimer -= delta;

        if (obstacleTimer <= 0) {

            createObstacle();

            const minimumDelay = 950;
            const randomDelay = Math.random() * 650;

            obstacleTimer =
                minimumDelay + randomDelay;

        }


        /* Déplacement des obstacles */

        for (
            let i = obstacles.length - 1;
            i >= 0;
            i--
        ) {

            const obstacle = obstacles[i];

            obstacle.x -=
                speed * (delta / 16.67);


            /* Collision */

            if (
                checkCollision(
                    player,
                    obstacle
                )
            ) {

                endGame();
                return;

            }


            /* Suppression hors écran */

            if (
                obstacle.x +
                obstacle.width <
                0
            ) {

                obstacles.splice(i, 1);

            }

        }


        /* Score */

        score += delta * 0.01;

        scoreDisplay.textContent =
            "Score : " +
            Math.floor(score);

    }


    /* =========================================================
       FIN
    ========================================================= */

    function endGame() {

        running = false;
        gameOver = true;

        startButton.textContent =
            "Recommencer";

        draw();

    }


    /* =========================================================
       DESSIN DU DECOR
    ========================================================= */

    function drawBackground() {

        if (
            backgroundImage.complete &&
            backgroundImage.naturalWidth > 0
        ) {

            /*
            On utilise un effet "cover":
            l'image remplit tout le canvas
            sans être déformée.
            */

            const imageRatio =
                backgroundImage.naturalWidth /
                backgroundImage.naturalHeight;

            const canvasRatio =
                WIDTH / HEIGHT;

            let sourceX = 0;
            let sourceY = 0;
            let sourceWidth =
                backgroundImage.naturalWidth;
            let sourceHeight =
                backgroundImage.naturalHeight;


            if (imageRatio > canvasRatio) {

                sourceWidth =
                    backgroundImage.naturalHeight *
                    canvasRatio;

                sourceX =
                    (
                        backgroundImage.naturalWidth -
                        sourceWidth
                    ) / 2;

            }
            else {

                sourceHeight =
                    backgroundImage.naturalWidth /
                    canvasRatio;

                sourceY =
                    (
                        backgroundImage.naturalHeight -
                        sourceHeight
                    ) / 2;

            }


            ctx.drawImage(

                backgroundImage,

                sourceX,
                sourceY,
                sourceWidth,
                sourceHeight,

                0,
                0,
                WIDTH,
                HEIGHT

            );

        }
        else {

            ctx.fillStyle = "#eee7dc";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

        }


        /*
        Voile blanc léger.
        Plus le dernier chiffre est élevé,
        plus le décor devient pâle.
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.16)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    }


    /* =========================================================
       DESSIN DU PERSONNAGE
    ========================================================= */

    function drawPlayer() {

        if (
            playerImage.complete &&
            playerImage.naturalWidth > 0
        ) {

            ctx.save();

            /*
            Petite ombre autour du personnage
            pour qu'il ressorte du décor.
            */

            ctx.shadowColor =
                "rgba(255,255,255,0.95)";

            ctx.shadowBlur = 5;

            ctx.drawImage(

                playerImage,

                player.x,
                player.y,

                player.width,
                player.height

            );

            ctx.restore();

        }
        else {

            ctx.fillStyle = "#222";

            ctx.fillRect(

                player.x,
                player.y,

                player.width,
                player.height

            );

        }

    }


    /* =========================================================
       DESSIN DES OBSTACLES
    ========================================================= */

    function drawObstacles() {

        for (
            const obstacle of obstacles
        ) {

            /*
            Bordure blanche
            */

            ctx.fillStyle =
                "rgba(255,255,255,0.95)";

            ctx.fillRect(

                obstacle.x - 2,
                obstacle.y - 2,

                obstacle.width + 4,
                obstacle.height + 2

            );


            /*
            Corps noir
            */

            ctx.fillStyle = "#181818";

            ctx.fillRect(

                obstacle.x,
                obstacle.y,

                obstacle.width,
                obstacle.height

            );

        }

    }


    /* =========================================================
       DESSIN GENERAL
    ========================================================= */

    function draw() {

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* Décor Montréal */

        drawBackground();


        /*
        Bande sombre en bas.
        Elle matérialise la route
        et améliore la lisibilité.
        */

        ctx.fillStyle =
            "rgba(20,20,20,0.68)";

        ctx.fillRect(
            0,
            GROUND,
            WIDTH,
            HEIGHT - GROUND
        );


        /* Ligne du sol */

        ctx.fillStyle =
            "rgba(255,255,255,0.75)";

        ctx.fillRect(
            0,
            GROUND,
            WIDTH,
            2
        );


        /* Personnage */

        drawPlayer();


        /* Obstacles */

        drawObstacles();


        /* =====================================================
           ECRAN DE DEPART
        ===================================================== */

        if (
            !running &&
            !gameOver
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.18)";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            ctx.fillStyle = "#111";

            ctx.font =
                "bold 25px Arial";

            ctx.textAlign = "center";

            ctx.fillText(
                "Clique sur « Commencer »",
                WIDTH / 2,
                55
            );

            ctx.textAlign = "left";

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        if (gameOver) {

            ctx.fillStyle =
                "rgba(255,255,255,0.80)";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            ctx.fillStyle = "#222";

            ctx.textAlign = "center";

            ctx.font =
                "bold 32px Arial";

            ctx.fillText(
                "GAME OVER",
                WIDTH / 2,
                HEIGHT / 2 - 10
            );

            ctx.font =
                "18px Arial";

            ctx.fillText(
                "Score : " +
                Math.floor(score),
                WIDTH / 2,
                HEIGHT / 2 + 25
            );

            ctx.textAlign = "left";

        }

    }


    /* =========================================================
       BOUCLE PRINCIPALE
    ========================================================= */

    function gameLoop(timestamp) {

        if (!running) {

            draw();
            return;

        }

        let delta =
            timestamp - lastTime;

        lastTime = timestamp;


        if (delta > 50) {
            delta = 50;
        }


        update(delta);
        draw();


        if (running) {

            requestAnimationFrame(
                gameLoop
            );

        }

    }


    /* =========================================================
       BOUTON
    ========================================================= */

    startButton.addEventListener(
        "click",
        function() {

            startGame();

        }
    );


    /* =========================================================
       CLAVIER
    ========================================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.code === "Space" ||
                event.code === "ArrowUp"
            ) {

                event.preventDefault();

                jump();

            }

        }
    );


    /* =========================================================
       SOURIS / TELEPHONE
    ========================================================= */

    canvas.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            jump();

        }
    );


    /* =========================================================
       CHARGEMENT DES IMAGES
    ========================================================= */

    playerImage.onload =
        function() {

            draw();

        };


    backgroundImage.onload =
        function() {

            draw();

        };


    playerImage.onerror =
        function() {

            console.log(
                "Impossible de charger player.png"
            );

            draw();

        };


    backgroundImage.onerror =
        function() {

            console.log(
                "Impossible de charger background.jpg"
            );

            draw();

        };


    /* =========================================================
       INITIALISATION
    ========================================================= */

    resetGame();

</script>

</body>
</html>
