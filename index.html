<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ostie de français</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f5f0e7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .game-container {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 34px;
        color: #151515;
    }

    .subtitle {
        margin-bottom: 16px;
        font-size: 18px;
        color: #666;
        font-weight: bold;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        border: 3px solid #222;
        border-radius: 10px;
        touch-action: manipulation;
    }

    .info {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    #score {
        font-size: 20px;
        font-weight: bold;
        color: #222;
    }

    button {
        border: none;
        background: #222;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .hint {
        margin-top: 12px;
        font-size: 14px;
        color: #666;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>OSTIE DE FRANÇAIS</h1>

    <div class="subtitle">
        Saute les obstacles et cours à travers Montréal !
    </div>

    <canvas id="game" width="800" height="500"></canvas>

    <div class="info">
        <span id="score">Score : 0</span>
        <button id="start">Commencer</button>
    </div>

    <div class="hint">
        Espace / ↑ / clic / toucher l'écran pour sauter
    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GROUND = 440;
const WIN_SCORE = 1997;


/* =========================================================
   IMAGES
========================================================= */

const playerImage = new Image();
playerImage.src = "player.png";

const backgroundImage = new Image();
backgroundImage.src = "background.jpg";

const cauliflowerImage = new Image();
cauliflowerImage.src = "cauliflower.png";

const soupImage = new Image();
soupImage.src = "soup.png";

const baconImage = new Image();
baconImage.src = "bacon.png";


/* =========================================================
   HTML
========================================================= */

const scoreDisplay = document.getElementById("score");
const startButton = document.getElementById("start");


/* =========================================================
   VARIABLES
========================================================= */

let player;
let obstacles = [];

let running = false;
let gameOver = false;
let won = false;

let score = 0;
let speed = 5;
let obstacleTimer = 0;
let lastTime = 0;


/* =========================================================
   JOUEUR
========================================================= */

function resetPlayer() {

    player = {
        x: 85,
        y: GROUND - 125,

        width: 48,
        height: 125,

        velocityY: 0,
        jumping: false
    };

}


/* =========================================================
   RESET
========================================================= */

function resetGame() {

    resetPlayer();

    obstacles = [];

    score = 0;
    speed = 5;
    obstacleTimer = 0;

    gameOver = false;
    won = false;
    running = false;

    scoreDisplay.textContent = "Score : 0";
    startButton.textContent = "Commencer";

    draw();

}


/* =========================================================
   DEMARRER
========================================================= */

function startGame() {

    resetPlayer();

    obstacles = [];

    score = 0;
    speed = 5;
    obstacleTimer = 0;

    gameOver = false;
    won = false;
    running = true;

    lastTime = performance.now();

    startButton.textContent = "Recommencer";

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   SAUT
========================================================= */

function jump() {

    /*
    On ne lance PAS une nouvelle partie automatiquement
    après un GAME OVER ou une victoire.
    */

    if (!running) {
        return;
    }

    if (!player.jumping) {

        player.velocityY = -15;
        player.jumping = true;

    }

}


/* =========================================================
   CREATION DES OBSTACLES / OBJETS
========================================================= */

function createObstacle() {

    const randomType = Math.random();

    /*
    15 % : bacon à attraper
    30 % : soupe haute
    55 % : chou-fleur bas
    */

    if (randomType < 0.15) {

        /*
        BACON
        Il faut le toucher.
        */

        const size = 48;

        obstacles.push({

            type: "bacon",

            x: WIDTH + 10,

            /*
            Il flotte un peu au-dessus du sol,
            donc il faut sauter pour le récupérer.
            */

            y: GROUND - 100,

            width: size,
            height: size

        });

    }
    else if (randomType < 0.45) {

        /*
        SOUPE
        Obstacle haut
        */

        const height =
            88 + Math.random() * 8;

        const width =
            50 + Math.random() * 6;

        obstacles.push({

            type: "soup",

            x: WIDTH + 10,
            y: GROUND - height,

            width: width,
            height: height

        });

    }
    else {

        /*
        CHOU-FLEUR
        Obstacle bas
        */

        const size =
            52 + Math.random() * 15;

        obstacles.push({

            type: "cauliflower",

            x: WIDTH + 10,
            y: GROUND - size,

            width: size,
            height: size

        });

    }

}


/* =========================================================
   COLLISIONS
========================================================= */

function checkCollision(a, b) {

    const playerPaddingX = 8;
    const playerPaddingY = 5;

    let obstaclePaddingX;
    let obstaclePaddingTop;


    if (b.type === "soup") {

        /*
        Hitbox plus indulgente que l'image.
        */

        obstaclePaddingX =
            b.width * 0.16;

        obstaclePaddingTop =
            b.height * 0.10;

    }
    else if (b.type === "bacon") {

        /*
        Bacon assez facile à attraper.
        */

        obstaclePaddingX =
            b.width * 0.08;

        obstaclePaddingTop =
            b.height * 0.08;

    }
    else {

        /*
        Chou-fleur irrégulier.
        */

        obstaclePaddingX =
            b.width * 0.12;

        obstaclePaddingTop =
            b.height * 0.10;

    }


    return (

        a.x + playerPaddingX <
        b.x + b.width - obstaclePaddingX &&

        a.x + a.width - playerPaddingX >
        b.x + obstaclePaddingX &&

        a.y + playerPaddingY <
        b.y + b.height &&

        a.y + a.height - playerPaddingY >
        b.y + obstaclePaddingTop

    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(delta) {

    if (!running) {
        return;
    }


    /* GRAVITE */

    player.velocityY += 0.75;
    player.y += player.velocityY;


    /* RETOUR AU SOL */

    if (
        player.y >=
        GROUND - player.height
    ) {

        player.y =
            GROUND - player.height;

        player.velocityY = 0;
        player.jumping = false;

    }


    /*
    DIFFICULTE
    +20 % d'accélération par rapport
    à la version précédente.
    */

    speed +=
        0.000030 * delta;


    /* APPARITION */

    obstacleTimer -= delta;

    if (obstacleTimer <= 0) {

        createObstacle();


        const progress =
            Math.min(
                score / WIN_SCORE,
                1
            );


        const minimumDelay =
            1300 - (450 * progress);

        const randomDelay =
            600 - (200 * progress);


        obstacleTimer =
            minimumDelay +
            Math.random() *
            randomDelay;

    }


    /* DEPLACEMENT / COLLISIONS */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];


        obstacle.x -=
            speed *
            (delta / 16.67);


        /*
        =====================================================
        COLLISION
        =====================================================
        */

        if (
            checkCollision(
                player,
                obstacle
            )
        ) {

            /*
            BACON :
            toucher = réussite.
            On le retire et le jeu continue.
            */

            if (
                obstacle.type === "bacon"
            ) {

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            /*
            CHOU-FLEUR OU SOUPE :
            toucher = GAME OVER.
            */

            endGame();
            return;

        }


        /*
        =====================================================
        SORTIE DE L'ECRAN
        =====================================================
        */

        if (
            obstacle.x +
            obstacle.width <
            0
        ) {

            /*
            BACON RATÉ :
            GAME OVER.
            */

            if (
                obstacle.type === "bacon"
            ) {

                endGame();
                return;

            }


            /*
            Les autres obstacles disparaissent normalement.
            */

            obstacles.splice(
                i,
                1
            );

        }

    }


    /* SCORE */

    score +=
        delta * 0.012;


    /* VICTOIRE */

    if (
        score >=
        WIN_SCORE
    ) {

        score =
            WIN_SCORE;

        scoreDisplay.textContent =
            "Score : " +
            WIN_SCORE;

        winGame();

        return;

    }


    scoreDisplay.textContent =
        "Score : " +
        Math.floor(score);

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    /*
    On stoppe immédiatement la boucle.
    Aucun redémarrage automatique.
    */

    running = false;
    gameOver = true;
    won = false;

    startButton.textContent =
        "Recommencer";

    draw();

}


/* =========================================================
   VICTOIRE
========================================================= */

function winGame() {

    running = false;
    gameOver = false;
    won = true;

    startButton.textContent =
        "Rejouer";

    draw();

}


/* =========================================================
   DECOR
========================================================= */

function drawBackground() {

    if (
        backgroundImage.complete &&
        backgroundImage.naturalWidth > 0
    ) {

        ctx.drawImage(
            backgroundImage,
            0,
            0,
            WIDTH,
            HEIGHT
        );

    }
    else {

        ctx.fillStyle =
            "#eee7dc";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    }


    ctx.fillStyle =
        "rgba(255,255,255,0.18)";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

}


/* =========================================================
   PERSONNAGE
========================================================= */

function drawPlayer() {

    if (
        playerImage.complete &&
        playerImage.naturalWidth > 0
    ) {

        ctx.save();

        ctx.shadowColor =
            "rgba(255,255,255,1)";

        ctx.shadowBlur =
            6;


        ctx.drawImage(
            playerImage,
            player.x,
            player.y,
            player.width,
            player.height
        );


        ctx.restore();

    }
    else {

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            player.x,
            player.y,
            player.width,
            player.height
        );

    }

}


/* =========================================================
   DESSIN DES OBSTACLES / BACON
========================================================= */

function drawObstacles() {

    for (
        const obstacle of obstacles
    ) {

        let imageToDraw;


        if (
            obstacle.type === "soup"
        ) {

            imageToDraw =
                soupImage;

        }
        else if (
            obstacle.type === "bacon"
        ) {

            imageToDraw =
                baconImage;

        }
        else {

            imageToDraw =
                cauliflowerImage;

        }


        if (
            imageToDraw.complete &&
            imageToDraw.naturalWidth > 0
        ) {

            ctx.save();


            /*
            Le bacon a un halo plus marqué,
            pour signaler visuellement qu'il est spécial.
            */

            if (
                obstacle.type === "bacon"
            ) {

                ctx.shadowColor =
                    "rgba(255,255,255,1)";

                ctx.shadowBlur =
                    11;

            }
            else {

                ctx.shadowColor =
                    "rgba(255,255,255,0.95)";

                ctx.shadowBlur =
                    5;

            }


            ctx.drawImage(
                imageToDraw,

                obstacle.x,
                obstacle.y,

                obstacle.width,
                obstacle.height
            );


            ctx.restore();

        }
        else {

            ctx.fillStyle =
                "#555";

            ctx.fillRect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );

        }

    }

}


/* =========================================================
   DESSIN GENERAL
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    drawBackground();


    /* LIGNE DU SOL */

    ctx.fillStyle =
        "rgba(255,255,255,0.45)";

    ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        2
    );


    drawPlayer();
    drawObstacles();


    /*
    =====================================================
    ECRAN DE DEPART
    =====================================================
    */

    if (
        !running &&
        !gameOver &&
        !won
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.fillRect(
            WIDTH / 2 - 165,
            22,
            330,
            48
        );


        ctx.fillStyle =
            "#111";

        ctx.font =
            "bold 23px Arial";

        ctx.textAlign =
            "center";


        ctx.fillText(
            "Clique sur « Commencer »",
            WIDTH / 2,
            54
        );


        ctx.textAlign =
            "left";

    }


    /*
    =====================================================
    GAME OVER
    =====================================================
    */

    if (gameOver) {

        /*
        On masque légèrement le décor
        mais on garde le contexte visible.
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.88)";

        ctx.fillRect(
            WIDTH / 2 - 220,
            HEIGHT / 2 - 90,
            440,
            165
        );


        ctx.strokeStyle =
            "#222";

        ctx.lineWidth =
            4;


        ctx.strokeRect(
            WIDTH / 2 - 220,
            HEIGHT / 2 - 90,
            440,
            165
        );


        ctx.fillStyle =
            "#222";

        ctx.textAlign =
            "center";


        ctx.font =
            "bold 31px Arial";


        ctx.fillText(
            "Accroche toi petit hérisson",
            WIDTH / 2,
            HEIGHT / 2 - 28
        );


        ctx.font =
            "18px Arial";


        ctx.fillText(
            "Score : " +
            Math.floor(score),
            WIDTH / 2,
            HEIGHT / 2 + 12
        );


        ctx.font =
            "16px Arial";


        ctx.fillText(
            "Clique sur « Recommencer » pour retenter ta chance.",
            WIDTH / 2,
            HEIGHT / 2 + 48
        );


        ctx.textAlign =
            "left";

    }


    /*
    =====================================================
    VICTOIRE
    =====================================================
    */

    if (won) {

        ctx.fillStyle =
            "rgba(255,255,255,0.90)";

        ctx.fillRect(
            55,
            105,
            WIDTH - 110,
            275
        );


        ctx.strokeStyle =
            "#222";

        ctx.lineWidth =
            4;


        ctx.strokeRect(
            55,
            105,
            WIDTH - 110,
            275
        );


        ctx.fillStyle =
            "#222";

        ctx.textAlign =
            "center";


        ctx.font =
            "bold 34px Arial";


        ctx.fillText(
            "BRAVO !",
            WIDTH / 2,
            155
        );


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "T'as bien gagné un indice,",
            WIDTH / 2,
            205
        );


        ctx.fillText(
            "ostie de française...",
            WIDTH / 2,
            238
        );


        ctx.font =
            "bold 23px Arial";


        ctx.fillText(
            "Le mot indice est :",
            WIDTH / 2,
            285
        );


        ctx.font =
            "bold 38px Arial";


        ctx.fillText(
            "SERPENT",
            WIDTH / 2,
            330
        );


        ctx.font =
            "18px Arial";


        ctx.fillText(
            "Bonne chance pour la suite !",
            WIDTH / 2,
            365
        );


        ctx.textAlign =
            "left";

    }

}


/* =========================================================
   BOUCLE
========================================================= */

function gameLoop(timestamp) {

    if (!running) {

        draw();
        return;

    }


    let delta =
        timestamp -
        lastTime;

    lastTime =
        timestamp;


    if (
        delta > 50
    ) {

        delta = 50;

    }


    update(delta);

    draw();


    if (running) {

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =========================================================
   CONTROLES
========================================================= */

startButton.addEventListener(
    "click",
    function() {

        /*
        Le bouton est désormais LE SEUL
        moyen de démarrer/recommencer après
        une défaite ou une victoire.
        */

        startGame();

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        jump();

    }
);


/* =========================================================
   CHARGEMENT DES IMAGES
========================================================= */

playerImage.onload =
function() {
    draw();
};


backgroundImage.onload =
function() {
    draw();
};


cauliflowerImage.onload =
function() {
    draw();
};


soupImage.onload =
function() {
    draw();
};


baconImage.onload =
function() {
    draw();
};


playerImage.onerror =
function() {

    console.log(
        "Impossible de charger player.png"
    );

    draw();

};


backgroundImage.onerror =
function() {

    console.log(
        "Impossible de charger background.jpg"
    );

    draw();

};


cauliflowerImage.onerror =
function() {

    console.log(
        "Impossible de charger cauliflower.png"
    );

    draw();

};


soupImage.onerror =
function() {

    console.log(
        "Impossible de charger soup.png"
    );

    draw();

};


baconImage.onerror =
function() {

    console.log(
        "Impossible de charger bacon.png"
    );

    draw();

};


/* =========================================================
   INITIALISATION
========================================================= */

resetGame();

</script>

</body>
</html>
